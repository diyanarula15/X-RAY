# X-RAY prototype configuration.
# Everything the SIMULATOR is allowed to know lives here.
# The estimator never reads this file (see xray/estimator.py::PublicPriors).

vehicle:
  mass_car: 768.0          # kg, 2026 minimum
  fuel_start: 70.0         # kg
  fuel_burn_per_lap: 1.4   # kg
  cda_straight: 0.66       # m^2, low-drag aero mode ("X-mode"). See README: chosen
                           # so a fully deployed car clears 340 km/h and the
                           # regulatory taper window actually exists.
  cda_corner: 1.42         # m^2, high-downforce aero mode
  crr: 0.012
  rho: 1.20                # kg/m^3
  brake_decel_max: 45.0    # m/s^2 (~4.5g). Legacy constant-deceleration bound.
                           # It is 4.59 g, which no tyre reaches on mechanical
                           # grip alone, so it has always had downforce baked in
                           # at an unstated speed. vehicle.brake_mu() inverts it
                           # rather than adding a second aero term on top.
  drivetrain_eff: 0.95
  # SYNTHETIC / ASSUMED -- NOT measured F1 values, NOT calibrated by anything in
  # this repo. Lift-area in the same two aero modes as cda_straight/cda_corner,
  # set at a lift-to-drag ratio of about 3 against the existing CdA. The one
  # sanity check they pass: inverting brake_decel_max against cla_corner gives a
  # friction coefficient of 1.48, which is inside the real slick range of about
  # 1.4-1.8. That makes them plausible, not calibrated. See model_inventory.md.
  # DEFAULT OFF (0.0), and that is a deliberate call, not an oversight.
  # Switching them on changes who wins the race: the follower overtakes and the
  # leader then spends 24.7% of the stint in a tow, which invalidates every
  # fixture that assumes the leader ran in clear air (setmem containment,
  # pipeline, rbpf, golden, live_readiness -- 18 tests). The physics is right;
  # the problem is that the number deciding the race order is one of these two,
  # and they are ASSUMED, not measured. An uncalibrated parameter does not get
  # to pick the winner. Enabling them is a separate, reviewable step that needs
  # calibration plus regeneration of every dependent fixture.
  # Reference values, L/D ~ 3 against the existing CdA, which invert
  # brake_decel_max to mu = 1.48 (inside the real slick range 1.4-1.8):
  #     cla_straight: 2.00     cla_corner: 4.30
  cla_straight: 0.0        # m^2, low-drag mode -- P1 aero disabled
  cla_corner: 0.0          # m^2, high-downforce mode -- P1 aero disabled
  brake_calibration_v_ms: 80.0   # ASSUMED: speed at which the load-dependent
                                 # brake model reproduces brake_decel_max

tow:
  cda_reduction: 0.25        # max fractional CdA reduction in tow
  tau_s: 0.80                # exponential decay constant vs gap in seconds
  # Renamed from dirty_air_grip_loss. The old key multiplied apex speed
  # directly, which put a wake effect in units of speed and made it impossible
  # to say whether a following car lost grip or lost load. It loses LOAD: this
  # is the fractional ClA retention loss, and the corner-speed consequence is
  # derived from it in vehicle.cornering_grip_from_downforce(). The old key is
  # still read as a fallback so existing configs do not silently lose the wake.
  # SYNTHETIC / ASSUMED, 1-D in gap only -- there is no lateral offset in this
  # model, so "alongside" and "directly behind" are the same place. Only in
  # force while ClA is non-zero; with P1 aero off the legacy key below is what
  # runs, which is why both are present and neither is dead.
  dirty_air_downforce_loss: 0.20
  dirty_air_grip_loss: 0.06  # legacy apex-speed multiplier, active while ClA = 0

environment:
  # True compass bearing (0 = north, 90 = east, clockwise) of the LOCAL +X axis
  # of the track coordinate frame. FastF1 position data is track-local and F1
  # publishes no rotation to true north, so this is null until somebody
  # establishes it from a survey or a circuit map and records the source below.
  #
  # While it is null, directional wind is UNAVAILABLE: the projection returns
  # available=False with a value of None, no headwind or tailwind is inferred,
  # and the real-data fit keeps its fitted wind nuisance as the whole wind
  # estimate. Setting this to 0.0 would not be a neutral default -- it would
  # assert that the position feed happens to be north-aligned, and the failure
  # mode is a sign flip that turns every headwind into a tailwind.
  track_frame_heading_deg_true_north: null
  track_frame_heading_source: unknown
  wetness:
    rain_gain_per_s: 0.008333     # ASSUMED: fully wet after ~2 min of rain
    drying_rate_per_s: 0.001667   # ASSUMED: dry after ~10 min at ref temp
    drying_ref_track_temp_c: 30.0 # ASSUMED

# EVERY NUMBER BELOW IS SYNTHETIC / ASSUMED. None of it is measured, none of it
# came from a tyre supplier, and none of it has been calibrated against a race.
# They are ordered plausibly relative to each other -- softer compounds grip more
# and wear faster, wets grip in the wet and overheat in the dry -- which makes
# the MODEL behave sensibly and says nothing about absolute accuracy.
# mu_long/mu_lat are quoted against normal load INCLUDING downforce, so they are
# tyre friction coefficients (~1.3-1.8), not the 4.5 g figure that a
# load-independent model needs. See docs/model_inventory.md.
tyres:
  compounds:
    SOFT:
      mu_long_base: 1.62
      mu_lat_base: 1.72
      optimal_temp_c: 100.0
      temp_window_c: 25.0
      thermal_tau_s: 40.0
      heating_gain: 30.0
      base_wear_per_m: 3.2e-6
      utilisation_wear_gain: 1.4
      thermal_wear_gain: 1.0
      max_wear_grip_loss: 0.22
      wet_grip_loss: 0.55
      dry_grip_loss: 0.0
      is_wet_compound: false
    MEDIUM:
      mu_long_base: 1.52
      mu_lat_base: 1.60
      optimal_temp_c: 95.0
      temp_window_c: 30.0
      thermal_tau_s: 45.0
      heating_gain: 26.0
      base_wear_per_m: 2.2e-6
      utilisation_wear_gain: 1.2
      thermal_wear_gain: 0.85
      max_wear_grip_loss: 0.17
      wet_grip_loss: 0.55
      dry_grip_loss: 0.0
      is_wet_compound: false
    HARD:
      mu_long_base: 1.43
      mu_lat_base: 1.50
      optimal_temp_c: 92.0
      temp_window_c: 34.0
      thermal_tau_s: 55.0
      heating_gain: 22.0
      base_wear_per_m: 1.5e-6
      utilisation_wear_gain: 1.0
      thermal_wear_gain: 0.70
      max_wear_grip_loss: 0.13
      wet_grip_loss: 0.55
      dry_grip_loss: 0.0
      is_wet_compound: false
    INTERMEDIATE:
      mu_long_base: 1.25
      mu_lat_base: 1.30
      optimal_temp_c: 70.0
      temp_window_c: 25.0
      thermal_tau_s: 40.0
      heating_gain: 20.0
      base_wear_per_m: 3.0e-6
      utilisation_wear_gain: 1.3
      thermal_wear_gain: 1.2
      max_wear_grip_loss: 0.20
      wet_grip_loss: 0.10
      dry_grip_loss: 0.30
      is_wet_compound: true
    WET:
      mu_long_base: 1.10
      mu_lat_base: 1.15
      optimal_temp_c: 60.0
      temp_window_c: 25.0
      thermal_tau_s: 38.0
      heating_gain: 18.0
      base_wear_per_m: 3.4e-6
      utilisation_wear_gain: 1.3
      thermal_wear_gain: 1.4
      max_wear_grip_loss: 0.22
      wet_grip_loss: 0.02
      dry_grip_loss: 0.45
      is_wet_compound: true
    # Used for any compound string this table does not know. Neutral on wetness
    # so an unrecognised 2026 compound makes no claim rather than a wrong one.
    _NEUTRAL:
      mu_long_base: 1.45
      mu_lat_base: 1.55
      optimal_temp_c: 95.0
      temp_window_c: 30.0
      thermal_tau_s: 45.0
      heating_gain: 25.0
      base_wear_per_m: 2.2e-6
      utilisation_wear_gain: 1.2
      thermal_wear_gain: 0.85
      max_wear_grip_loss: 0.17
      wet_grip_loss: 0.0
      dry_grip_loss: 0.0
      is_wet_compound: false

sim:
  dt: 0.005                # s, fixed step, semi-implicit Euler
  n_laps: 12
  start_gap_s: 0.9         # initial time gap, follower behind leader
  # The demo scenario: the rival ahead of us burns its store early, we hold
  # ours back. That contrast is what the estimator has to see and the decision
  # engine has to exploit.
  leader_policy: AGGRESSIVE      # the rival we are X-raying
  follower_policy: CONSERVATIVE  # us
  e_start_frac: 0.75       # initial store as fraction of E_STORE_MAX

observe:
  rate_hz: 3.7
  speed_noise_ms: 0.35
  quantize_kmh: 1.0

estimator:
  n_particles: 400
  savgol_seconds: 0.8
  cda_prior_wind_sigma: 3.0   # m/s, weak prior pulling the wind nuisance to zero
  deploy_scale_sigma: 0.06    # per-particle systematic deployment-scale spread
  # J, synthetic likelihood scale for a "ran dry" observation. NOTHING READS
  # THIS KEY: estimate() takes the value from its own RESERVE_SIGMA default, so
  # editing the yaml alone changes no behaviour at all. It was edited alone once.
  # Kept, mirrored, and pinned by test_config_dry_event_scale_matches_the_code
  # so the two cannot silently disagree again.
  dry_event_e_scale: 100000.0
  floor_violation_penalty: 6.0

render:
  fps: 30
  width: 1920
  height: 1080
  dpi: 120
